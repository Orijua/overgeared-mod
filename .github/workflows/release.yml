# Builds and publishes a release when a version tag (v0.1.0, v1.2.3...) is pushed: checks that the tag matches
# `mod_version`, takes the notes from the tag's section of CHANGELOG.md, runs the same checks as the CI and attaches the
# jar to a GitHub release (marked as pre-release while the version starts with 0.). See RELEASING.md.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the mod version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MOD_VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          if [ "$VERSION" != "$MOD_VERSION" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but gradle.properties says mod_version=$MOD_VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Take the release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 { found = 1; next } /^## \[/ { found = 0 } found' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section '## [$VERSION]' with content"
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile and unit tests
        run: ./gradlew build --console=plain

      - name: Game tests
        run: ./gradlew runGameTestServer --console=plain

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=""
          case "$VERSION" in 0.*) FLAGS="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "build/libs/overgearedmod-${VERSION}.jar" \
            --title "$GITHUB_REF_NAME" --notes-file release-notes.md $FLAGS
