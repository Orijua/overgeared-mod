# Compiles the mod and runs the unit tests and the game tests on every PR and every push to master.
name: Build

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle and the downloaded Minecraft/NeoForge artifacts between runs.
      - uses: gradle/actions/setup-gradle@v4

      - name: Compile and unit tests
        run: ./gradlew build --console=plain

      - name: Game tests
        run: ./gradlew runGameTestServer --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests
            build/test-results
            run/logs
